name: Report

on:
  push:
    paths:
      - "report/**"
      - "scripts/build_report.py"
      - ".github/workflows/report.yml"
  pull_request:
    paths:
      - "report/**"
      - "scripts/build_report.py"
      - ".github/workflows/report.yml"

permissions:
  contents: read

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk poppler-utils

      - name: Install pinned Tectonic
        env:
          TECTONIC_SHA256: f3c825128095dc3399ea11c08c18035b33050a216930c295c79e8eb11bd21de4
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.16.9/tectonic-0.16.9-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TECTONIC_SHA256}  /tmp/tectonic.tar.gz" | sha256sum --check -
          mkdir -p /tmp/tectonic
          tar -xzf /tmp/tectonic.tar.gz -C /tmp/tectonic
          echo "/tmp/tectonic" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build and validate five-page report
        run: |
          python -B scripts/build_report.py \
            --build-dir tmp/report-ci \
            --output tmp/report-ci/final_report_5page_ko.pdf \
            --require-pdfinfo

      - name: Render pages for review
        run: |
          mkdir -p tmp/report-ci/rendered
          pdftoppm -png -r 120 \
            tmp/report-ci/final_report_5page_ko.pdf \
            tmp/report-ci/rendered/page

      - uses: actions/upload-artifact@v4
        with:
          name: final-report-preview
          path: |
            tmp/report-ci/final_report_5page_ko.pdf
            tmp/report-ci/main.log
            tmp/report-ci/rendered/
